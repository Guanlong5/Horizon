name: Daily Horizon Summary

on:
  schedule:
    # GitHub 定时任务使用 UTC 时间。
    # 下面 '0 0 * * *' = UTC 00:00 = 北京时间 08:00。
    # GitHub 定时器常有 5-30 分钟延迟，若想更早收到可改为 '0 23 * * *'（北京 07:00）。
    - cron: '0 0 * * *'
  workflow_dispatch:      # 允许你在网页手动点一下立即运行，用于测试

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 仅 GitHub Pages 归档步骤需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare config for GitHub Actions
        run: |
          cp data/config.github.json data/config.json
          cp subscribers.json data/subscribers.json

      - name: Run Horizon
        env:
          # AI 模型密钥（必填，在仓库 Settings → Secrets → Actions 里添加）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # QQ 邮箱授权码（必填，16 位，不是登录密码）
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run horizon --hours 24

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 可选步骤：把每天的简报归档成网页。失败也不影响上面的微信推送。
      - name: Archive to GitHub Pages (optional)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
